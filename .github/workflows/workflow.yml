  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: production
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.HOST_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          # Migrating every tenant database can outlast the 10 minute default.
          command_timeout: 30m
          script: |
            cd ${{ vars.APP_PATH }}
            git pull --ff-only origin main
            # Installs, checks the .env (app:check-environment), builds and migrates. It stops if any step fails;
            # the app is not put into maintenance mode. See scripts/deploy.sh.
            bash scripts/deploy.sh production


  deploy-testing:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    environment: staging
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.HOST_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          # Migrating every tenant database can outlast the 10 minute default.
          command_timeout: 30m
          script: |
            cd ${{ vars.APP_PATH }}
            git pull --ff-only origin testing
            # Installs, checks the .env (app:check-environment), builds and migrates. It stops if any step fails;
            # the app is not put into maintenance mode. See scripts/deploy.sh.
            bash scripts/deploy.sh staging


  assign-author:
    name: Auto Assign PR Author
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    steps:
      - name: Assign PR author
        uses: actions-ecosystem/action-add-assignees@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ github.actor }}
