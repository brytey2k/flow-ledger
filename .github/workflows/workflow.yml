name: CI & Deploy & Auto Assign PR Author

on:
  push:
    branches:
      - main
      - testing
  pull_request:
    branches:
      - main
      - testing

permissions:
  contents: read
  pull-requests: write

# A newer push to a pull request makes its running checks moot; pushes to main/testing always finish (they deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, ctype, fileinfo, json, pdo, pdo_pgsql, tokenizer, xml, redis
          tools: composer:v2
          coverage: none


      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Prepare Environment
        run: |
          if [ -f .env ]; then rm .env; fi
          cp .env.ci .env
          php -r "file_exists('.env') || exit(1);"
          php artisan key:generate --no-interaction
        env:
          APP_ENV: local
          APP_DEBUG: 'true'
          APP_URL: http://localhost
          CACHE_DRIVER: redis
          SESSION_DRIVER: array
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: sync
          BROADCAST_DRIVER: log
          MAIL_MAILER: log

      - name: Check Code Style (Pint)
        run: composer pint-test

      # The deploy runs `php artisan optimize`; fail here, not halfway through a deploy, if a cache cannot be built
      # (e.g. a duplicate route name breaks route:cache). APP_ENV=production gives the production central domains.
      - name: Check Production Caches Build
        env:
          APP_ENV: production
        run: |
          php artisan optimize
          php artisan config:clear
          php artisan route:clear
          php artisan event:clear
          php artisan view:clear

      - name: Run Static Analysis (PHPStan)
        run: composer phpstan

  test:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    # The suite is split into time-balanced shards (Pest --shard, timings in tests/.pest/shards.json), each run in
    # parallel on its own runner with its own database server. Record (and later refresh) the timings with `composer test-update-shards`
    # when files are added or get much slower; files missing from it are dealt round-robin across the shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing_flow_ledger
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, ctype, fileinfo, json, pdo, pdo_pgsql, tokenizer, xml, redis
          tools: composer:v2
          # No coverage is collected (see the commented-out steps at the end). When it comes back, use pcov, not xdebug.
          coverage: none


      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Prepare Environment
        run: |
          if [ -f .env ]; then rm .env; fi
          cp .env.ci .env
          php -r "file_exists('.env') || exit(1);"
          php artisan key:generate --no-interaction
        env:
          APP_ENV: local
          APP_DEBUG: 'true'
          APP_URL: http://localhost
          CACHE_DRIVER: redis
          SESSION_DRIVER: array
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: sync
          BROADCAST_DRIVER: log
          MAIL_MAILER: log

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Run Tests
        run: composer test-parallel -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

#      - name: Run Tests with Coverage (PR)
